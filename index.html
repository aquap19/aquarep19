<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patrice Stutz Aquarelles</title>

<meta name="author" content="Patrice Stutz">
<meta name="description" content="Aquarelles et peintures numériques de paysages urbains, paysages et scènes diverses.">

<style>

:root{
    --accent:#279E9C;
    --red:#8B0000;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff;
    color:#000;
}

/* ================= MENU ================= */

.menu{
    list-style:none;
    margin:20px;
    padding:0;
    display:flex;
    justify-content:center;
    gap:15px;
}

.menu a{
    text-decoration:none;
    color:#000;
    font-size:14px;
    letter-spacing:2px;
    padding:10px 15px;
}

.menu a:hover{
    color:var(--accent);
}

/* ================= HERO ================= */

.hero{
    max-width:1000px;
    margin:60px auto 100px auto;
    padding:0 20px;
}

.hero-inner{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
}

.hero-logo img{
    width:260px;
    height:auto;
}

.hero-image img{
    width:320px;
    height:auto;
    display:block;
}

.hero-signature img{
    width:45px;
    height:auto;
}

/* ================= TEXTE INTRO ================= */

.intro{
    max-width:700px;
    margin:120px auto 60px auto;
    text-align:center;
}

.intro p{
    line-height:1.8;
    color:#555;
    font-style:italic;
}

/* ================= MOSAIQUE ================= */

.home-gallery{
    max-width:1100px;
    margin:0 auto 100px auto;
    padding:0 20px;
}

.home-gallery h2{
    text-align:center;
    font-size:18px;
    letter-spacing:3px;
    margin-bottom:20px;
}

.mosaic{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    grid-template-rows:220px 220px;
    gap:12px;
}

.mosaic a{
    display:block;
    overflow:hidden;
}

.mosaic img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.4s;
}

.mosaic img:hover{
    transform:scale(1.04);
}

.big{
    grid-row:1 / span 2;
}

/* ================= MOBILE ================= */

.burger{
    display:none;
    font-size:30px;
    padding:15px;
    cursor:pointer;
}

@media screen and (max-width:768px){

    .burger{
        display:block;
    }

    .menu{
        display:none;
        flex-direction:column;
        align-items:center;
        margin:0;
    }

    .menu.active{
        display:flex;
    }

    .hero{
        margin:30px auto 60px auto;
    }

    .hero-inner{
        flex-direction:column;
        gap:25px;
    }

    .hero-logo img{
        width:220px;
    }

    .hero-image img{
        width:100%;
        max-width:320px;
    }
    
    .mosaic{
        grid-template-columns:1fr;
        grid-template-rows:auto;
    }

    .big{
        grid-row:auto;
    }

    .mosaic a{
        height:250px;
    }
}

</style>
</head>

<body>

<nav>

<div class="burger" onclick="toggleMenu()">☰</div>

<ul class="menu" id="menu">

    <li><a href="Accueil.cityscapes.html">PAYSAGES URBAINS</a></li>
    <li><a href="Landscapes.html">PAYSAGES</a></li>
    <li><a href="Divers.html">DIVERS</a></li>
    <li><a href="biocontact.html">BIO / CONTACT</a></li>
</ul>

</nav>

<section class="hero">

<div class="hero-inner">

    <div class="hero-logo">
        <img src="A.Index6/psaquarelles.png" alt="Patrice Stutz">
    </div>

    <div class="hero-image">
        <img src="A.Index6/imageaccueil.jpg" alt="">
    </div>

    <div class="hero-signature">
        <img src="A.Index6/signrougefonce.png" alt="">
    </div>

</div>

</section>

<section class="intro">

<p>
Une sélection d'aquarelles et de peintures numériques inspirées de villes recomposées à partir de multiples points de vue.
</p>

</section>

<section class="home-gallery">

<h2>PAYSAGES URBAINS</h2>

<div class="mosaic">

    <a href="Accueil.cityscapes.html" class="big">
        <img src="Paysages_Urbains_Cityscapes/London.JPG" alt="">
    </a>

    <a href="Accueil.cityscapes.html">
        <img src="Paysages_Urbains_Cityscapes/crépuscule-tordu.JPG" alt="">
    </a>

    <a href="Accueil.cityscapes.html">
	<img src="Paysages_Urbains_Cityscapes/morning.light.jpg" width="1596" height="2445" alt=""/> 
	</a>

    <a href="Accueil.cityscapes.html">
        <img src="Paysages_Urbains_Cityscapes/Bruxelles6.JPG" alt="">
    </a>

    <a href="Accueil.cityscapes.html">
        <img src="Paysages_Urbains_Cityscapes/BigBen.JPG" alt="">

</div>

</section>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
