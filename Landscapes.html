<!DOCTYPE html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquarelles Stutz</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
	padding-bottom: 4cm;
}

/* MENU */
.menu {
    list-style: none;
    margin: 15px;
    padding: 0;
    display: flex;
    justify-content: flex-start;
}

.menu a {
    display: block;
    padding: 15px 25px;
    font-size: 14px;
    letter-spacing: 2px;
    text-decoration: none;
    color: black;
}

/* BURGER */
.burger {
    display: none;
    font-size: 30px;
    padding: 15px;
    cursor: pointer;
}

/* TITRE */
.gallery-header {
    text-align: center;
    margin-top: 60px;
}

.gallery-header h1 {
    color: #8B0000;
    font-size: 22px;
    letter-spacing: 5px;
    font-family: Georgia, serif;
    font-weight: normal;
    text-transform: uppercase;
}

/* GALERIE : on garde les tailles réelles */
.gallery {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 60px;
    margin-top: 40px;
}

/* lignes comme ancienne composition */
.row {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 80px;
    flex-wrap: wrap;
}

/* images EXACTEMENT comme avant */
.img570 { width: 570px; height: auto; }
.img447 { width: 447px; height: auto; }
.img374 { width: 374px; height: auto; }
.img472 { width: 472px; height: auto; }

/* signature/logo */
.footer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 80px;
    gap: 20px;
}

.signature {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #666;
}

/* MOBILE */
@media (max-width: 768px) {

    .burger { display: block; }

    .menu {
        display: none;
        flex-direction: column;
    }

    .menu.active { display: flex; }

    .row {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .img570,
    .img447,
    .img374,
    .img472 {
        width: 95%;
        max-width: 570px;
    }
}
</style>
</head>
