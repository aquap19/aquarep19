
# Page HTML modernisée avec formulaire de contact responsive

```html
<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bio / Contact</title>

<style>

:root {
    --accent: #279E9C;
    --red: #C00000;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    background: #fff;
    color: #000;
}

/* =========================
   NAVIGATION
========================= */

header {
    width: 100%;
}

nav {
    width: 100%;
}

.menu {
    list-style: none;
    margin: 15px;
    padding: 0;

    display: flex;
    gap: 5px;

    background: white;
}

.menu a {
    display: block;
    padding: 15px 25px;

    text-decoration: none;
    color: black;

    font-size: 16px;
    transition: color 0.3s ease;
}

.menu a:hover {
    color: var(--accent);
}

/* Burger */

.burger {
    display: none;
    font-size: 30px;
    padding: 15px;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
}

/* =========================
   CONTENU
========================= */

main {
    width: 100%;
    padding: 20px;
}

.content {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 40px;
    align-items: start;

    max-width: 1200px;
    margin: 0 auto;
}

.bio {
    padding-top: 20px;
    max-width: 500px;
}

.bio h1 {
    margin-top: 0;

    font-size: 32px;
    color: var(--red);
}

.bio p {
    font-size: 18px;
    margin-top: 20px;
}

/* =========================
   TEXTE PERSONNALISABLE
========================= */

.custom-text-block {
    margin-bottom: 30px;
}

.custom-text-block h2 {
    font-size: 22px;
    margin-bottom: 12px;
    color: var(--red);
}

.custom-text {
    width: 100%;
    min-height: 220px;

    padding: 16px;

    border: 1px solid #ccc;
    border-radius: 6px;

    font-size: 16px;
    line-height: 1.5;
    font-family: Arial, sans-serif;

    resize: vertical;
}

.custom-text:focus {
    outline: none;
    border-color: var(--accent);
}

/* =========================
   FORMULAIRE
========================= */
    font-size: 18px;
    margin-top: 20px;
}

/* =========================
   FORMULAIRE
========================= */

.contact-form {
    margin-top: 30px;

    display: flex;
    flex-direction: column;
    gap: 15px;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 14px;

    border: 1px solid #ccc;
    border-radius: 6px;

    font-size: 16px;
    font-family: Arial, sans-serif;

    transition: border-color 0.3s ease;
}

.contact-form input:focus,
.contact-form textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.contact-form textarea {
    min-height: 180px;
    resize: vertical;
}

.contact-form button {
    width: fit-content;
    padding: 14px 24px;

    border: none;
    border-radius: 6px;

    background: var(--accent);
    color: white;

    font-size: 16px;
    cursor: pointer;

    transition: opacity 0.3s ease;
}

.contact-form button:hover {
    opacity: 0.85;
}

/* =========================
   IMAGES
========================= */

.visuals {
    display: flex;
    align-items: stretch;
    gap: 20px;
}

.visuals img {
    display: block;
    max-width: 100%;
    height: auto;
}

.signature-column {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;

    /* Descend les logos vers le bouton envoyer */
    padding-top: 340px;

    gap: 12px;
}

/* =========================
   RESPONSIVE
========================= */

@media screen and (max-width: 768px) {

    .burger {
        display: block;
    }

    .menu {
        display: none;
        flex-direction: column;
        width: 100%;
        margin: 0;
    }

    .menu.active {
        display: flex;
    }

    .content {
        grid-template-columns: 1fr;
    }

    .visuals {
        flex-direction: column;
        align-items: center;
    }

    .signature-column {
        flex-direction: row;
        justify-content: center;
    }

    .bio {
        text-align: center;
        max-width: 100%;
    }

    .contact-form button {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>

    <nav>

        <!-- Bouton burger -->
        <button class="burger"
                aria-label="Ouvrir le menu"
                onclick="toggleMenu()">
            ☰
        </button>

        <!-- Menu -->
        <ul class="menu" id="menu">
            <li><a href="index.html">ACCUEIL</a></li>
            <li><a href="Accueil.cityscapes.html">PAYSAGES URBAINS</a></li>
            <li><a href="Landscapes.html">PAYSAGES</a></li>
            <li><a href="Divers.html">DIVERS</a></li>
            <li><a href="biocontact.html">BIO / CONTACT</a></li>
        </ul>

    </nav>

</header>

<main>

    <section class="content">

        <!-- Texte -->
        <article class="bio">

            <!-- Zone de texte personnalisable -->
            <section class="custom-text-block">
                <h2>Présentation</h2>

                <textarea class="custom-text"
                          placeholder="Saisissez votre texte ici..."></textarea>
            </section>

            <p>
                Vous pouvez m'envoyer un message directement depuis cette page.
            </p>

            <!-- Formulaire -->
            <form class="contact-form"
                  action="https://formspree.io/f/TON_ID_FORMULAIRE"
                  method="POST">

                <input
                    type="text"
                    name="nom"
                    placeholder="Votre nom"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Votre e-mail"
                    required>

                <textarea
                    name="message"
                    placeholder="Votre message"
                    required></textarea>
				
				<input type="hidden"
                    name="_next"
                    value="https://https://aquap19.github.io/aquarep19//merci.html">

                <button type="submit">
                    Envoyer
                </button>

            </form>

        </article>

        <!-- Images -->
        <aside class="visuals">

            <figure class="lego">
                <img
                    src="Bio6/construction.jpg"
                    width="361"
                    height="255"
                    alt="page en construction">
            </figure>

            <section class="signature-column">

                <figure class="signature">
                    <img
                        src="Signatures_Logos6/signrougefonce.png"
                        width="41"
                        height="173"
                        alt="Signature">
                </figure>

                <figure class="logo">
                    <img
                        src="Signatures_Logos6/logoP19carré_rouge.png"
                        width="52"
                        height="50"
                        alt="Logo">
                </figure>

            </section>

        </aside>

    </section>

</main>

<script>

function toggleMenu() {
    document
        .getElementById("menu")
        .classList
        .toggle("active");
}

</script>

</body>
</html>
